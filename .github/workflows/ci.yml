name: Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This repository is public, so pull requests can come from forks. The checks
# only read the tree and never publish anything, so the token they get should
# be able to do the same.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VERSION is the single source of the version number; package.json must
      # not drift from it (scripts/write_frontend_config.js reads VERSION).
      - run: test "$(node -p "require('./package.json').version")" = "$(cat VERSION)"
      - run: npm run lint:frontend
      - run: npm run build:frontend
      - run: npm run test:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          # This repository's dependency file is requirements-local.txt. Without
          # naming it, the cache step looks for requirements.txt, fails to find
          # one, and the job ends before pip, pylint or pytest ever run — which
          # is how this workflow reported red while checking nothing.
          cache-dependency-path: requirements-local.txt
      # The media tests that run the real ffmpeg skip themselves without it, and
      # a skip in CI reads as a pass. tests/test_ci_env.py fails if this is gone.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-local.txt
      - run: pip install pytest pytest-timeout pylint ruff
      # Rule selection (E and F) and the per-file exceptions live in pyproject.toml.
      - run: python3 -m ruff check backend/ scripts/
      - run: python3 -m pylint backend/ --errors-only --disable=import-error,no-member
      # -rs prints every skip with its reason, so a suite that silently skipped
      # half its media tests is visible in the log.
      - run: python3 -m pytest tests/ -q -rs
