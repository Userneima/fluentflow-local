name: Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This repository is public, so pull requests can come from forks. The checks
# only read the tree and never publish anything, so the token they get should
# be able to do the same.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run build:frontend
      - run: npm run test:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          # This repository's dependency file is requirements-local.txt. Without
          # naming it, the cache step looks for requirements.txt, fails to find
          # one, and the job ends before pip, pylint or pytest ever run — which
          # is how this workflow reported red while checking nothing.
          cache-dependency-path: requirements-local.txt
      - run: pip install -r requirements-local.txt
      - run: pip install pytest pylint
      - run: python3 -m pylint backend/ --errors-only --disable=import-error,no-member
      - run: python3 -m pytest tests/ -q
